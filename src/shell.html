<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17685b"><meta name="description" content="모르는 용어는 눈으로 확인하고 필요한 요청문은 꺼내 쓰는 한국어 바이브 코딩 사전."><title>나의 바이브 코딩 가이드북</title><style>/*APP_CSS*/</style></head>

<aside class="sidebar" aria-label="가이드북 목차">
 <a class="brand" href="#" aria-label="가이드북 처음으로"><span class="brand-icon" aria-hidden="true">v.</span><span>나의 바이브 코딩<br><b>가이드북</b></span></a>
 <p class="sidebar-label">사전 목차</p><nav id="tabs" class="wiki-nav" aria-label="가이드 종류"></nav>
 <div class="sidebar-section"><p class="sidebar-label">처음이라면</p><button id="start-course" class="nav-extra" data-start-course>입문 코스 <span aria-hidden="true">↗</span></button><span id="course-total">6단계 · 한 카드씩 살펴보기</span></div>
 <div class="sidebar-section"><p class="sidebar-label">내 서랍</p><button id="records" class="nav-extra" data-records>즐겨찾기·기록 관리</button><button id="about" class="nav-extra" data-about>출처와 사용 안내</button></div>
 <p class="sidebar-foot">로그인 없이 사용<br>즐겨찾기는 이 브라우저에 저장</p>
</aside>
<div class="workspace">
 <section class="situations wrap" aria-label="상황별 도우미"><div class="situation-heading"><h1>지금 어떤 상황인가요?</h1><button id="mobile-menu" class="icon-btn" aria-haspopup="dialog" aria-controls="nav-dialog">목차 ☰</button></div><div id="situations" class="chip-row"></div><div id="situation-example" class="situation-example"></div></section>
 <header class="header"><div class="wrap"><div class="searchline"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" type="search" placeholder="이름 대신 생김새나 상황으로 검색하세요. 예: 옆에서 나오는 메뉴" autocomplete="off" aria-label="용어와 상황 검색"><kbd>/</kbd></label></div><div class="filterline"><div id="categories" class="chip-row" aria-label="세부 분류"></div><label class="select-label">정렬 <select id="sort"><option value="default">기본 순서</option><option value="name">이름순</option></select></label></div></div></header>
 <div class="wrap page">
  <section id="course-panel" class="course-panel" hidden><div class="section-heading"><div><span class="eyebrow">START SMALL</span><h2>바이브 코딩 입문 코스</h2></div><button id="exit-course" class="quiet">전체 카드 보기</button></div><div id="course-list" class="course-list"></div><div id="course-guidance" class="course-guidance"></div></section>
  <section aria-label="카드 찾아보기"><div class="results-line"><h2 id="list-title">전체 가이드</h2><span id="count" role="status" aria-live="polite"></span><button id="clear" class="quiet" hidden>조건 초기화</button></div><p id="context-note" class="context-note"></p><main id="main" class="cards"></main></section>
  <footer><div><b>나의 바이브 코딩 가이드북</b><p>UI는 직접 조작하고, 개발 개념·스킬은 가상 예제로 살펴보세요. 실제 AI·GitHub 실행은 아닙니다.</p></div><div>자료 확인 2026.10.27</div></footer>
 </div>
</div>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><div class="drawer-top"><span id="drawer-badge" class="eyebrow"></span><button id="close-drawer" class="icon-btn" aria-label="상세 창 닫기">닫기 <span aria-hidden="true">×</span></button></div><div id="drawer-body"></div></dialog>
