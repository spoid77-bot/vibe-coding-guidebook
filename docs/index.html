<script>const ITEMS=[{"id":"base-vibe","title":"바이브 코딩","en":"Vibe Coding","description":"원하는 결과를 말로 설명하고, AI가 만든 코드를 직접 확인하며 개선하는 작업 방식입니다. 결과를 판단하는 역할은 사람에게 남습니다.","tags":"시작 처음 초보 입문 AI 개발","steps":[["요구 정리","시험 일정 목록을 만들고 싶다고 설명합니다."],["작게 구현","날짜와 시험명만 입력하는 첫 화면을 만듭니다."],["직접 확인","빈 날짜를 입력해 보고 오류 안내가 나오는지 확인합니다."]],"prompt":"시험 일정 관리 도구를 만들고 싶어. 먼저 사용자와 입력 항목, 성공 기준을 정리하고 최소 화면부터 만들어줘. 실제로 실행해 확인한 것과 미확인을 구분해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://learn.chatgpt.com/docs/build-skills","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-prompt","title":"좋은 요청문","en":"Prompt","description":"목적·입력·원하는 결과·확인 기준을 함께 설명하면 AI와 기대를 맞추기 쉽습니다.","tags":"프롬프트 지시 요구사항 질문","steps":[["막연한 요청","“평가표를 예쁘게 만들어줘”만으로는 입력과 판정 기준을 알 수 없습니다."],["조건 추가","입력: 시험명·조건·결과. 미확인 값은 “확인 필요”로 표시합니다."],["확인 기준","실제 결과와 제안 기준을 구분해 표시하는지 확인합니다."]],"prompt":"[목적]을 위한 도구를 만들어줘. 입력은 [항목], 결과는 [형태]야. 성공 기준은 [직접 확인할 행동]이야. 모르는 기준은 만들지 말고 확인 필요로 표시해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://learn.chatgpt.com/docs/build-skills","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-html","title":"내용과 구조","en":"HTML","description":"제목·문단·입력칸·버튼 같은 웹페이지의 구성 요소를 정합니다.","tags":"태그 웹페이지 뼈대 제목 버튼","steps":[["제목","시험 결과라는 제목을 배치합니다."],["입력칸","시험명 입력칸과 저장 버튼을 배치합니다."],["구조 확인","제목과 입력칸이 구분됩니다. 색과 간격은 CSS의 역할입니다."]],"prompt":"시험명 입력칸과 저장 버튼이 있는 HTML 화면을 만들어줘. 입력칸에 보이는 라벨을 붙이고 키보드로도 사용할 수 있게 해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-css","title":"모양과 배치","en":"CSS","description":"같은 내용도 색·글꼴·간격·배치를 바꿔 읽기 좋게 표현할 수 있습니다.","tags":"스타일 색상 간격 글꼴 디자인","steps":[["기본 화면","입력칸과 버튼이 기본 모양으로 나타납니다."],["스타일 적용","간격을 넓히고 주요 버튼을 강조합니다."],["좁은 화면","휴대폰 너비에서는 입력칸과 버튼을 세로로 배치합니다."]],"prompt":"기존 기능은 유지하고 CSS로 간격과 글자 대비를 개선해줘. 휴대폰에서는 가로 스크롤 없이 사용할 수 있게 해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-javascript","title":"화면의 동작","en":"JavaScript","description":"클릭·입력에 반응해 화면의 내용을 바꾸는 역할을 합니다.","tags":"자바스크립트 JS 클릭 이벤트 로직","steps":[["클릭 전","목록에 아직 시험 항목이 없습니다."],["클릭 감지","저장 버튼을 누르는 동작을 받습니다."],["화면 변경","입력한 시험명이 목록에 표시됩니다. 서버 저장 여부는 별도입니다."]],"prompt":"저장 버튼을 누르면 입력한 시험명이 목록에 추가되게 해줘. 빈 입력을 막고, 현재 저장 위치가 브라우저인지 서버인지 알려줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-frontend","title":"보이는 화면","en":"Frontend","description":"사용자가 보고 입력하는 화면입니다. 서버와 연결하지 않은 화면도 만들 수 있습니다.","tags":"프런트엔드 프론트엔드 화면 UI","steps":[["화면 표시","시험 일정 목록과 추가 버튼이 보입니다."],["사용자 입력","사용자가 시험명을 입력합니다."],["요청 전달","서버 저장을 쓰는 경우 입력을 백엔드에 보냅니다."]],"prompt":"시험 일정 프런트엔드를 먼저 만들어줘. 가상 데이터임을 표시하고, 서버에 실제 저장되는 것처럼 안내하지 마.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-backend","title":"서버의 처리","en":"Backend","description":"요청을 받아 권한을 확인하고 데이터를 읽거나 저장하는 서버 측 처리입니다.","tags":"백엔드 서버 권한 처리","steps":[["요청 수신","시험 일정 저장 요청을 받습니다."],["권한·값 확인","저장 권한과 필요한 입력을 검사합니다."],["결과 응답","저장 성공 또는 오류를 화면에 전달합니다."]],"prompt":"서버에서 입력값과 사용자 권한을 확인한 뒤 저장하게 해줘. 저장 실패 시 성공 메시지를 보여주지 않도록 해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-api","title":"프로그램의 연결 약속","en":"API","description":"화면과 서버 등이 정해진 방식으로 요청과 결과를 주고받는 통로입니다.","tags":"에이피아이 요청 응답 연결 fetch","steps":[["요청","화면이 시험 일정 목록을 요청합니다."],["처리","서버가 권한을 확인하고 목록을 준비합니다."],["응답","성공이면 목록을, 실패하면 오류 정보를 받습니다."]],"prompt":"목록 API의 입력과 응답 예시를 먼저 보여줘. 로딩·성공·오류 상태를 각각 화면에서 확인할 수 있게 해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-git","title":"변경 기록","en":"Git","description":"파일의 변경 내용을 버전으로 기록해 비교하고 이전 상태를 확인하는 도구입니다.","tags":"버전관리 되돌리기 깃 stage commit","steps":[["작업 파일","시험명 입력칸을 수정합니다. 아직 기록된 버전은 아닙니다."],["기록 대상 선택","이번에 기록할 변경을 고릅니다."],["커밋","변경 묶음에 설명을 붙여 로컬 기록으로 남깁니다."]],"prompt":"현재 변경 파일을 확인하고 이번 기능에 해당하는 변경만 커밋 후보로 정리해줘. 관련 없는 파일은 포함하지 마.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://git-scm.com/docs/gittutorial","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-branch","title":"분리된 작업 흐름","en":"Branch","description":"기준 버전에서 작업 흐름을 나눠 기능을 개발하고, 검토 후 합칠 수 있습니다.","tags":"브랜치 main 병합 분리","steps":[["기준 버전","main에 기존 시험 일정 화면이 있습니다."],["기능 작업","새 브랜치에서 검색 기능을 만듭니다."],["검토 후 병합","테스트와 변경 검토를 마친 뒤 기준 흐름에 합칩니다."]],"prompt":"현재 브랜치를 먼저 확인해줘. 새 기능은 분리된 브랜치에서 작업하고, 완료 후 변경 내용과 검증 결과를 보여줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://git-scm.com/docs/gittutorial","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-github","title":"온라인 협업 공간","en":"GitHub","description":"Git 저장소를 온라인에서 보관하고 변경 검토와 협업에 사용하는 서비스입니다. Git 자체와 구분합니다.","tags":"깃허브 push pull 원격 저장소 PR","steps":[["로컬 기록","내 PC의 Git에 커밋이 있습니다."],["원격에 전송","선택한 저장소에 변경 기록을 올립니다."],["온라인 검토","변경 내용을 공유하고 검토할 수 있습니다. 공개 저장소는 누구나 볼 수 있습니다."]],"prompt":"올리려는 저장소와 공개 범위, 변경 파일을 먼저 확인해줘. 비밀번호·회사 자료가 포함되지 않았는지 확인한 뒤 현재 승인된 범위만 진행해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://git-scm.com/docs/gittutorial","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-debug","title":"오류 원인 찾기","en":"Debugging","description":"증상을 재현하고 근거를 확인해 원인을 좁힌 다음 필요한 부분을 수정합니다.","tags":"디버깅 에러 오류 버그 안됨","steps":[["재현","빈 시험명으로 저장하면 목록에 빈 줄이 생깁니다."],["원인 확인","입력값이 비어 있는지 검사하는 과정이 없습니다."],["수정·재확인","빈 값은 막고 정상 값은 저장되는지 각각 확인합니다."]],"prompt":"[오류 메시지와 재현 순서]를 보고 원인을 조사해줘. 추측으로 여러 파일을 바꾸지 말고, 수정 후 같은 절차로 재확인해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://github.com/obra/superpowers/blob/main/skills/systematic-debugging/SKILL.md","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-test","title":"기대 결과 확인","en":"Test","description":"특정 입력이나 행동에 대해 기대한 결과가 나오는지 확인합니다. 통과한 범위를 함께 알아야 합니다.","tags":"테스트 검증 품질 확인 완료","steps":[["기대 정하기","빈 시험명은 저장되지 않아야 합니다."],["실행","빈 시험명으로 저장 버튼을 누릅니다."],["판정","안내가 나오고 목록이 늘지 않으면 이 시나리오는 통과입니다. 전체 품질 보장은 아닙니다."]],"prompt":"핵심 사용 흐름과 실패 입력을 실제로 확인해줘. 실행한 검사, 결과, 확인하지 못한 환경을 구분해 알려줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://github.com/obra/superpowers/blob/main/skills/verification-before-completion/SKILL.md","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-deploy","title":"주소로 서비스하기","en":"Deployment","description":"완성된 파일이나 프로그램을 사용자가 접속할 수 있는 환경에 올리는 작업입니다.","tags":"배포 공개 무료 사이트 Pages 주소","steps":[["로컬 확인","내 PC에서 화면과 버튼이 작동하는지 확인합니다."],["배포","공개 서버에 파일을 올립니다."],["실제 주소 확인","배포된 주소에서 다시 기능을 확인합니다. 회사망 접근은 별도 확인합니다."]],"prompt":"배포 대상과 공개 범위를 확인하고 사이트를 게시해줘. 실제 주소에서 핵심 기능을 확인하고 미확인 환경을 알려줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-skill","title":"재사용 작업 안내서","en":"Skill","description":"AI가 특정 작업을 반복 수행할 때 참고하는 지침과 자료 묶음입니다. 설치·사용 가능 여부는 환경마다 다릅니다.","tags":"스킬 SKILL.md 설치 호출 도구","steps":[["작업 요청","오류 원인을 조사해 달라고 요청합니다."],["지침 참고","설치된 관련 스킬의 절차와 자료를 참고합니다."],["도구로 실행","환경에서 허용된 도구로 조사하고 검증합니다. 스킬 자체가 실행 엔진은 아닙니다."]],"prompt":"사용 가능한 스킬 중 [작업]에 맞는 것을 골라줘. 선택 이유와 필요한 연결·도구를 알려주고, 설치되지 않은 스킬을 실행했다고 말하지 마.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://learn.chatgpt.com/docs/build-skills","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"base-context","title":"AI에게 주는 배경","en":"Context","description":"목표·파일·제약·결정 사항을 함께 전달하면 AI가 작업 맥락을 파악하는 데 도움이 됩니다.","tags":"컨텍스트 대화 길어짐 기억 핸드오프 AGENTS","steps":[["배경 누락","“아까 화면 고쳐줘”만으로는 대상이 불분명합니다."],["정보 정리","대상 파일, 증상, 원하는 결과, 보존할 기능을 전달합니다."],["작업 인계","완료·미완료와 실행 방법을 기록해 다음 작업에 전달합니다."]],"prompt":"현재 작업을 다음 대화에 이어갈 수 있게 정리해줘. 목표, 합의한 결정, 변경 파일, 검증 결과, 다음 할 일을 구분해줘.","source":"공식 문서 · 개념을 쉽게 재구성","sourceUrl":"https://learn.chatgpt.com/docs/build-skills","type":"기초 개념","category":"개발 기초","level":"입문"},{"id":"ui-hero","demo":"hero","type":"UI 용어","category":"레이아웃","en":"Hero Section","title":"히어로 섹션","tags":"첫화면 메인화면 대문 배너 맨위 큰제목 시작버튼 CTA 랜딩","description":"접속하자마자 보이는 첫 소개 영역","prompt":"첫 화면에 짧은 제목, 설명, CTA 버튼, 제품 이미지가 있는 히어로 섹션을 만들어줘","edit":"히어로 섹션의 CTA 버튼을 더 크게 하고 배경을 그라데이션으로 바꿔줘","keywords":"hero, h1, cta, min-h-screen","source":"사용자 제공 ui_dictionary.html","sourceUrl":"","level":"입문"},{"id":"ui-responsive","demo":"responsive","type":"UI 용어","category":"레이아웃","en":"Responsive Layout","title":"반응형 레이아웃","tags":"모바일 화면깨짐 폰에서 태블릿 화면크기 줄이면 열개수","description":"화면 너비에 맞춰 배치가 바뀜","prompt":"카드를 데스크톱 3열, 태블릿 2열, 모바일 1열로 배치되는 반응형 레이아웃으로 만들어줘","edit":"모바일에서 레이아웃이 깨져. 768px 이하에서는 1열로 바꿔줘","keywords":"@media, md:, lg:, grid-cols, flex-wrap","source":"사용자 제공 ui_dictionary.html","sourceUrl":"","level":"입문"},{"id":"ui-card","demo":"card","type":"UI 용어","category":"레이아웃","en":"Card Layout","title":"카드 레이아웃","tags":"박스 상자 목록 썸네일 상품목록 블로그목록","description":"정보를 같은 모양 박스로 나눠 나열","prompt":"상품을 이미지·제목·가격이 있는 카드 레이아웃으로 보여줘","edit":"카드 간격을 넓히고 모서리를 둥글게, 그림자를 은은하게 바꿔줘","keywords":"card, grid, gap, rounded, shadow","source":"사용자 제공 ui_dictionary.html","sourceUrl":"","level":"입문"},{"id":"ui-bento","demo":"bento","type":"UI 용어","category":"레이아웃","en":"Bento Grid","title":"벤토 그리드","tags":"크기다른카드 도시락 애플스타일 기능소개 큰칸 작은칸 불규칙","description":"크기가 다른 칸을 퍼즐처럼 조합","prompt":"주요 기능 5개를 벤토 그리드로 배치하고 가장 중요한 기능은 2칸 크기로 해줘","edit":"벤토 그리드에서 첫 번째 칸을 가로 2칸, 세로 2칸으로 키워줘","keywords":"grid, col-span, row-span, grid-template-areas","source":"사용자 제공 ui_dictionary.html","sourceUrl":"","level":"입문"},{"id":"ui-sidebar","demo":"sidebar","type":"UI 용어","category":"레이아웃","en":"S 기능·큰 수정을 시작하기 직전. AI가 엉뚱한 걸 만들어서 다시 시작해야 할 때","prompt":"$grill-me 아래 계획을 구현하기 전에 질문으로 검증해줘. 함께 답할 수 있는 질문은 묶고, 질문마다 추천 답을 붙여줘. 코드를 읽어서 알 수 있는 건 묻지 말고 직접 확인해줘. 결정이 다 정리되기 전에는 코드를 쓰지 마.\n계획: [만들 기능 설명]","caution":"막연한 한 줄 아이디어보다 대략적인 계획이 있을 때 효과가 큼","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills/blob/main/skills/productivity/grill-me/SKILL.md","level":"실전","verified":true,"steps":[["막연한 계획","“시험 일정 도구를 만들자”라는 계획에서 시작합니다."],["질문과 선택","누가 쓰는지, 어떤 입력과 알림이 필요한지 질문합니다."],["범위 합의","확정한 요구와 남은 질문을 구분한 뒤 구현 범위를 맞춥니다."]]},{"id":"skill-grill-with-docs","type":"스킬","category":"시작·요구정리","en":"$grill-with-docs","title":"그릴 위드 독스 (질문 + 용어집)","tags":"요구 용어집 GLOSSARY 프로젝트용어 ADR 결정기록 장황 말이길어","description":"grill-me에 더해 프로젝트 용어집(GLOSSARY.md)과 중요한 결정 기록(ADR)을 함께 만들고 갱신. 용어가 통일되면 AI 답변이 짧고 정확해짐","when":"프로젝트 초반. AI가 같은 것을 여러 이름으로 부르거나 설명이 장황할 때","prompt":"$grill-with-docs [기능]을 설계하면서 질문해줘. 정리된 용어는 GLOSSARY.md에, 되돌리기 어려운 결정은 ADR로 기록해줘.","caution":"기존에 CONTEXT.md를 만들었다면 GLOSSARY.md로 이름 변경 필요 (CONTEXT-MAP.md는 GLOSSARY-MAP.md로)","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["설계 질문","시험과 평가의 의미가 서로 다른지 질문합니다."],["용어 통일","함께 정한 의미를 용어집에 기록합니다."],["결정 기록","중요한 선택의 이유를 결정 기록으로 남깁니다."]]},{"id":"skill-ask-matt","type":"스킬","category":"시작·요구정리","en":"$ask-matt","title":"애스크 맷 (스킬 길잡이)","tags":"어떤스킬 뭐부터 모르겠음 추천 길잡이 순서","description":"지금 상황에 어떤 스킬·순서가 맞는지 골라주는 안내 스킬","when":"어떤 스킬을 써야 할지 모를 때","prompt":"$ask-matt 지금 상황은 [상황 설명]이야. 어떤 스킬을 어떤 순서로 쓰면 좋을지 추천해줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["상황 설명","“에러가 반복되고 어디부터 봐야 할지 모르겠다”고 설명합니다."],["스킬 선택","현재 상황에 맞는 진단·검증 스킬 후보를 고릅니다."],["순서 안내","어떤 스킬을 먼저 쓸지 이유와 함께 안내합니다."]]},{"id":"skill-brainstorming","type":"스킬","category":"시작·요구정리","en":"$brainstorming","title":"슈퍼파워 (전체 개발 방법론)","tags":"요구 아이디어 전체워크플로 자동 방법론 설계 계획 서브에이전트","description":"만들기 전에 질문으로 의도를 끌어내고, 설계 승인 → 작은 단위 계획 → 서브에이전트 구현·리뷰까지 자동으로 이어지는 전체 방법론","when":"아이디어부터 검토된 코드까지 한 시스템에 맡기고 싶을 때","prompt":"[만들 것]을 만들고 싶어. 바로 코딩하지 말고 brainstorming 스킬로 내가 원하는 것을 질문으로 정리한 뒤, 설계를 짧은 단위로 보여주고 내 승인을 받아줘.","caution":"자동으로 발동하고 서브에이전트를 많이 써서 토큰 소모가 큼. 작은 수정에는 무거울 수 있음","originalInstall":"# Codex CLI 안에서\n/plugins  → superpowers 검색 → Install Plugin","source":"obra/superpowers","sourceUrl":"https://github.com/obra/superpowers","level":"실전","verified":false,"steps":[["아이디어","시안이 필요한 목적과 사용 상황을 살펴봅니다."],["대안 비교","가능한 접근법의 장단점을 비교합니다."],["설계 구체화","선택한 방향과 첫 구현 범위를 구체화합니다."]]},{"id":"skill-to-spec","type":"스킬","category":"계획","en":"$to-spec","title":"투 스펙 (명세서 만들기)","tags":"명세서 스펙 계획정리 문서화 기능목록","description":"지금까지 대화에서 합의한 내용을 명세서(무엇을 만들지 정리한 전체 계획)로 정리. 새로 인터뷰하지 않음","when":"grill-me로 내용을 정한 직후","prompt":"$to-spec 지금까지 대화에서 정한 내용을 명세서로 정리해줘. 새로 질문하지 말고 합의된 내용만 담아줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["합의 내용","사용자·입력·화면·성공 기준을 모읍니다."],["명세 작성","합의된 내용을 구현 기준 문서로 정리합니다."],["미결 표시","대화에서 정하지 않은 요구를 임의로 확정하지 않습니다."]]},{"id":"skill-to-tickets","type":"스킬","category":"계획","en":"$to-tickets","title":"투 티켓스 (작업 나누기)","tags":"티켓 작업분해 할일 순서 선후관계 쪼개기","description":"계획·명세를 작은 작업 티켓으로 나누고, 어떤 작업이 먼저 끝나야 하는지 표시","when":"명세서가 생긴 뒤, 구현 맡기기 직전","prompt":"$to-tickets 이 명세서를 작은 작업 티켓으로 나눠줘. 티켓마다 먼저 끝나야 하는 작업을 표시하고 로컬 파일로 저장해줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["명세 확인","시험 목록, 검색, 저장 요구를 읽습니다."],["작업 분리","입력 화면·저장·검색을 확인 가능한 작업으로 나눕니다."],["의존 표시","저장 구조가 필요한 검색 작업은 선행 조건을 표시합니다."]]},{"id":"skill-prototype","type":"스킬","category":"계획","en":"$prototype","title":"프로토타입 (버릴 시안)","tags":"시안 여러안 비교 프로토타입 고민 결정못함 UI비교","description":"디자인 질문에 답하기 위한 버릴 시안. 상태·로직용 HTML 1개, 또는 서로 다른 UI 여러 개를 한 화면에서 전환","when":"어떤 UI·동작이 나을지 결정하지 못할 때","prompt":"$prototype [화면/기능]을 서로 확실히 다른 UI 3가지로 빠르게 만들어서 한 화면에서 전환해 볼 수 있게 해줘. 버릴 코드이니 본 코드에는 섞지 마.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills/blob/main/skills/engineering/prototype/SKILL.md","level":"실전","verified":true,"steps":[["설계 질문","검색을 상단에 둘지 옆 패널에 둘지 고민합니다."],["시안 비교","같은 내용의 다른 화면을 직접 조작해 비교합니다."],["선택","선호하는 구성을 정합니다. 시안이 곧 제품 완성은 아닙니다."]]},{"id":"skill-implement-spec","type":"스킬","category":"구현","en":"$implement-spec","title":"임플리먼트 스펙 (병렬 구현)","tags":"구현 병렬 여러에이전트 맡기기 자동진행 큰기능","description":"티켓 순서를 정해 동시에 해도 되는 작업은 여러 AI에게 나눠 맡기고, 끝나면 합쳐서 전체 코드 리뷰까지 진행","when":"명세서와 티켓이 준비된 뒤 큰 기능을 한 번에 맡길 때","prompt":"$implement-spec [명세서 파일 또는 이슈]를 구현해줘. 티켓 순서대로 진행하고, 동시에 해도 되는 작업은 병렬로 나눠줘. 끝나면 $code-review로 전체 검토하고 결과를 요약해줘.","caution":"여러 에이전트가 동시에 일해서 토큰 사용량이 큼. 먼저 $to-spec, $to-tickets로 준비","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"심화","verified":false,"steps":[["작업 준비","명세와 작업별 의존 관계를 확인합니다."],["구현·통합","독립 작업을 진행하고 함께 동작하도록 합칩니다."],["전체 검토","통합 후 변경 내용과 실행 결과를 다시 검토합니다."]]},{"id":"skill-karpathy","type":"스킬","category":"구현","en":"AGENTS.md 규칙","title":"카파시 가이드라인 (행동 규칙)","tags":"엉뚱 과함 과잉 오버엔지니어링 관련없는수정 규칙 원칙 가정","description":"4가지 원칙: 코딩 전에 생각(가정 먼저 말하기), 단순하게, 필요한 곳만 수정, 목표(성공 기준) 중심 실행","when":"프로젝트 시작 때 AGENTS.md에 한 번 넣어둠. AI가 묻지도 않고 과하게 만들거나 상관없는 코드까지 고칠 때","prompt":"AGENTS.md의 4원칙을 지켜서 [작업]해줘. 애매한 부분은 가정을 먼저 말하고, 요청하지 않은 코드는 고치지 마. 끝나면 성공 기준을 어떻게 확인했는지 알려줘.","caution":"기존 AGENTS.md를 덮어쓰지 않도록 >>(이어쓰기)로 추가. 아주 사소한 작업에는 느려질 수 있음","originalInstall":"curl -s https://raw.githubusercontent.com/multica-ai/andrej-karpathy-skills/main/CLAUDE.md >> AGENTS.md","source":"multica-ai/andrej-karpathy-skills","sourceUrl":"https://github.com/multica-ai/andrej-karpathy-skills","level":"실전","verified":false,"steps":[["가정 확인","모호한 요구를 확인하고 필요한 가정을 밝힙니다."],["최소 변경","검색 기능만 필요한데 앱 전체를 다시 만들지 않습니다."],["목표 확인","정한 성공 기준으로 결과를 확인합니다."]]},{"id":"skill-source-driven","type":"스킬","category":"구현","en":"@source-driven-development","title":"소스 드리븐 (공식문서 근거)","tags":"공식문서 최신버전 옛날문법 deprecated 라이브러리 버전 근거","description":"프레임워크 관련 결정을 공식 문서로 확인하고 출처를 남김. 확인 못한 부분은 따로 표시","when":"AI가 옛 버전 문법을 쓰거나, 최신 라이브러리를 쓸 때","prompt":"@source-driven-development [라이브러리] 공식 문서를 근거로 [기능]을 구현해줘. 참고한 문서 출처를 남기고, 확인하지 못한 부분은 따로 표시해줘.","originalInstall":"codex plugin marketplace add addyosmani/agent-skills\ncodex plugin add agent-skills@agent-skills\n# Codex에서는 @스킬이름 으로 호출","source":"addyosmani/agent-skills","sourceUrl":"https://github.com/addyosmani/agent-skills","level":"실전","verified":false,"steps":[["버전 확인","프로젝트가 사용하는 라이브러리 버전을 확인합니다."],["공식 근거","해당 버전의 공식 문서에서 사용법을 찾습니다."],["출처 기록","적용한 내용과 확인하지 못한 부분을 구분합니다."]]},{"id":"skill-tdd","type":"스킬","category":"테스트·디버깅","en":"$tdd","title":"TDD (테스트 먼저)","tags":"테스트 버그 재발 고쳤는데또 깨짐 red green 검증","description":"실패하는 테스트를 먼저 쓰고 → 통과시키고 → 정리하는 루프를 한 조각씩 반복","when":"로직 구현·버그 수정 때. \"고쳤다는데 또 깨진다\"가 반복될 때","prompt":"$tdd [기능/버그]를 테스트 먼저 방식으로 진행해줘. 실패하는 테스트를 먼저 쓰고 실패를 확인한 뒤, 통과시키는 최소 코드를 작성해줘. 한 번에 한 조각씩.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["실패 검사","빈 시험명이 저장되지 않아야 한다는 검사를 먼저 만듭니다."],["최소 구현","실패한 검사를 통과하도록 필요한 코드를 작성합니다."],["정리·반복","검사가 통과하는 상태를 유지하며 코드를 정리합니다."]]},{"id":"skill-diagnosing-bugs","type":"스킬","category":"테스트·디버깅","en":"$diagnosing-bugs","title":"버그 진단","tags":"버그 안잡힘 에러 느려짐 성능 원인 재현 디버깅","description":"버그를 재현하는 확인 루프를 먼저 만들고 → 범위 좁히기 → 가설 → 측정 → 수정 → 재발 방지 테스트 순서로 진행","when":"몇 번 시도해도 안 잡히는 버그, 갑자기 느려졌을 때","prompt":"$diagnosing-bugs [증상: 언제, 어떻게 틀리는지]. 먼저 이 버그를 재현하는 방법을 만들고, 가설을 세워 확인한 다음 고쳐줘. 고친 뒤 재발 방지 테스트도 추가해줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["재현 경로","어떤 입력과 순서에서 실패하는지 고정합니다."],["가설 검증","관찰·측정으로 문제가 생기는 범위를 좁힙니다."],["재발 방지","원인을 수정하고 같은 오류를 잡는 검사를 남깁니다."]]},{"id":"skill-systematic-debugging","type":"스킬","category":"테스트·디버깅","en":"$systematic-debugging","title":"체계적 디버깅","tags":"버그 에러 근본원인 추측수정 여기저기 디버깅","description":"4단계 근본 원인 추적. 추측으로 여러 곳을 건드리지 않게 함","when":"AI가 원인도 모른 채 이곳저곳 고치기 시작할 때","prompt":"$systematic-debugging [에러 메시지/증상]의 근본 원인을 찾아줘. 추측으로 여러 곳을 고치지 말고, 원인을 증거로 확인한 뒤 필요한 곳만 수정해줘.","originalInstall":"# Codex CLI 안에서\n/plugins  → superpowers 검색 → Install Plugin","source":"obra/superpowers","sourceUrl":"https://github.com/obra/superpowers/blob/main/skills/systematic-debugging/SKILL.md","level":"실전","verified":true,"steps":[["근본 원인","오류 메시지와 재현 과정을 먼저 조사합니다."],["비교·가설","정상 동작과 비교하고 하나의 가설을 검증합니다."],["수정·검증","원인이 확인된 부분을 수정한 뒤 다시 검사합니다."]]},{"id":"skill-verification","type":"스킬","category":"테스트·디버깅","en":"$verification-before-completion","title":"완료 전 검증","tags":"확인 다됐다는데 안됨 완료 검증 테스트실행 빌드","description":"\"다 됐습니다\"라고 말하기 전에 실제로 테스트·빌드를 돌려 증거를 보여주게 함","when":"AI가 끝났다고 했는데 실제로 돌려보면 안 될 때","prompt":"$verification-before-completion 방금 작업이 정말 끝났는지 확인해줘. 테스트와 빌드를 실제로 실행하고 결과를 보여준 다음에만 완료라고 말해줘.","originalInstall":"# Codex CLI 안에서\n/plugins  → superpowers 검색 → Install Plugin","source":"obra/superpowers","sourceUrl":"https://github.com/obra/superpowers/blob/main/skills/verification-before-completion/SKILL.md","level":"실전","verified":true,"steps":[["완료 주장","AI가 “저장 기능을 고쳤다”고 말합니다. 아직 증거는 없습니다."],["실제 검사","정상 입력·빈 입력으로 직접 저장을 실행합니다."],["근거와 한계","통과한 검사와 확인하지 못한 환경을 함께 보고합니다."]]},{"id":"skill-browser-testing","type":"스킬","category":"테스트·디버깅","en":"@browser-testing-with-devtools","title":"브라우저 테스트 (DevTools)","tags":"확인 화면안뜸 버튼안됨 콘솔 네트워크 브라우저 레이아웃깨짐","description":"Chrome DevTools MCP로 실제 브라우저의 DOM, 콘솔 로그, 네트워크, 성능을 확인","when":"화면이 안 뜨거나 버튼이 동작하지 않을 때, UI 수정 후 확인할 때","prompt":"@browser-testing-with-devtools 브라우저에서 [페이지]를 열고 콘솔 에러, 네트워크 실패, 레이아웃 문제를 확인해줘. 찾은 문제와 근거(로그·스크린샷)를 정리해줘.","caution":"Chrome DevTools MCP 연결이 필요","originalInstall":"codex plugin marketplace add addyosmani/agent-skills\ncodex plugin add agent-skills@agent-skills\n# Codex에서는 @스킬이름 으로 호출","source":"addyosmani/agent-skills","sourceUrl":"https://github.com/addyosmani/agent-skills","level":"실전","verified":false,"steps":[["브라우저 열기","검사할 화면과 필요한 DevTools 연결을 확인합니다."],["화면·로그","실제 클릭 동작과 콘솔·네트워크 실패를 살펴봅니다."],["근거 정리","관찰한 문제를 화면과 로그 근거로 설명합니다."]]},{"id":"skill-code-review","type":"스킬","category":"리뷰·배포","en":"$code-review","title":"코드 리뷰 (2축)","tags":"리뷰 검토 커밋전 규칙 명세 품질","description":"마지막 기준점 이후 변경을 \"코딩 규칙 준수\"와 \"명세대로 구현했는지\" 두 갈래로 나눠 동시에 검토","when":"커밋·병합하기 전","prompt":"$code-review 마지막 커밋 이후 변경을 검토해줘. 코딩 규칙 준수와 명세 구현 여부를 나눠서 보고, 심각한 것부터 알려줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["변경 범위","검토할 기준 버전과 변경 파일을 정합니다."],["두 기준 검토","프로젝트 규칙 준수와 요청한 동작 구현을 각각 봅니다."],["문제 보고","수정할 문제와 근거를 중요도에 따라 정리합니다."]]},{"id":"skill-pr","type":"스킬","category":"리뷰·배포","en":"$pr","title":"PR 설명 정리","tags":"PR 풀리퀘스트 설명 합치기 병합 검토요청","description":"PR 설명을 3부분으로: 무엇이 바뀌었는지(간단한 그림), 해결됐다는 근거(수정 전후 테스트), 다른 기능 영향과 되돌릴 수 있는지","when":"변경 사항을 프로젝트에 합치기 전","prompt":"$pr 이번 변경으로 PR 설명을 써줘. 무엇이 바뀌었는지(간단한 흐름도), 해결됐다는 근거(수정 전후 테스트), 다른 기능에 주는 영향과 되돌릴 수 있는지를 포함해줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["변경 이유","무슨 문제를 해결했고 어떤 행동이 달라졌는지 정리합니다."],["검증 근거","수정 전후 결과와 실제 검사 내용을 기록합니다."],["검토 요청","영향과 한계를 포함해 변경 검토용 설명을 완성합니다."]]},{"id":"skill-security","type":"스킬","category":"리뷰·배포","en":"@security-and-hardening","title":"보안 점검","tags":"보안 로그인 결제 입력 비밀키 API키 취약점 배포전","description":"OWASP Top 10 기준으로 입력 검증, 인증, 비밀키 관리, 의존성 취약점을 점검","when":"로그인·결제·사용자 입력·외부 API를 붙인 직후, 배포 전","prompt":"@security-and-hardening [로그인/폼/API] 부분의 보안을 점검해줘. 입력 검증, 인증, 비밀키 노출, 의존성 취약점을 확인하고 심각도 순으로 알려줘.","originalInstall":"codex plugin marketplace add addyosmani/agent-skills\ncodex plugin add agent-skills@agent-skills\n# Codex에서는 @스킬이름 으로 호출","source":"addyosmani/agent-skills","sourceUrl":"https://github.com/addyosmani/agent-skills","level":"실전","verified":false,"steps":[["노출 지점","입력·로그인·외부 API와 비밀키 사용을 확인합니다."],["취약점 점검","입력 검증과 권한 확인이 빠진 곳을 찾습니다."],["우선순위","확인한 문제와 개선 순서를 구분해 제시합니다."]]},{"id":"skill-simplify","type":"스킬","category":"리뷰·배포","en":"@code-simplification","title":"코드 단순화","tags":"복잡 지저분 읽기어려움 정리 리팩터링 단순화","description":"동작은 그대로 두고 코드를 더 읽기 쉽게 줄임","when":"작동은 하는데 코드가 너무 복잡해 수정이 겁날 때","prompt":"@code-simplification [파일/함수]를 동작은 그대로 두고 더 읽기 쉽게 정리해줘. 바꾼 이유를 짧게 설명하고, 테스트로 동작이 같은지 확인해줘.","originalInstall":"codex plugin marketplace add addyosmani/agent-skills\ncodex plugin add agent-skills@agent-skills\n# Codex에서는 @스킬이름 으로 호출","source":"addyosmani/agent-skills","sourceUrl":"https://github.com/addyosmani/agent-skills","level":"실전","verified":false,"steps":[["현재 동작","작동하는 기능과 유지할 결과를 확인합니다."],["구조 정리","중복을 줄이고 읽기 쉽게 정리합니다."],["동작 비교","정리 전후 기능이 같은지 확인합니다."]]},{"id":"skill-improve-arch","type":"스킬","category":"리뷰·배포","en":"$improve-codebase-architecture","title":"구조 개선 후보 찾기","tags":"스파게티 구조 복잡 엉망 아키텍처 정리 리팩터링","description":"코드베이스를 훑어 구조를 개선할 후보를 HTML 보고서로 보여주고, 고른 후보를 질문으로 함께 정리","when":"며칠에 한 번. 코드가 점점 엉켜 수정이 어려워질 때","prompt":"$improve-codebase-architecture 코드베이스에서 구조를 개선할 후보를 찾아 HTML 보고서로 보여줘. 바로 고치지 말고 후보만 제시해줘.","caution":"조사 도구이지 자동 정리 도구가 아님. 후보 중 하나를 골라 진행","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["코드 조사","수정하기 어렵거나 책임이 얽힌 부분을 찾습니다."],["후보 제시","개선 후보와 이유를 보고서로 비교합니다."],["방향 선택","선택한 후보를 질문으로 구체화한 뒤 변경을 계획합니다."]]},{"id":"skill-finishing","type":"스킬","category":"리뷰·배포","en":"$finishing-a-development-branch","title":"브랜치 마무리","tags":"PR 병합 머지 브랜치 마무리 정리 배포","description":"테스트 통과를 먼저 확인한 뒤, 로컬 병합 / PR 생성 / 유지 / 폐기 네 가지 중 선택하게 함","when":"기능 브랜치 작업을 끝낼 때","prompt":"$finishing-a-development-branch 이 브랜치 작업을 마무리해줘. 테스트가 모두 통과하는지 먼저 확인하고, 병합·PR·유지·폐기 중 선택지를 보여줘.","caution":"폐기 선택은 되돌릴 수 없으니 확인 후 진행","originalInstall":"npx skills add https://github.com/obra/superpowers --skill finishing-a-development-branch","source":"obra/superpowers","sourceUrl":"https://github.com/obra/superpowers","level":"실전","verified":false,"steps":[["검증 먼저","브랜치를 마무리하기 전 테스트 결과를 확인합니다."],["선택지","병합·PR·유지·폐기 중 적합한 방식을 고릅니다."],["마무리","선택한 절차를 수행합니다. 체험에서는 실제 브랜치를 바꾸지 않습니다."]]},{"id":"skill-yeet","type":"스킬","category":"리뷰·배포","en":"$yeet","title":"이트 (커밋~PR 한 번에)","tags":"PR 커밋 푸시 올리기 한번에 배포 깃허브","description":"stage → commit → push → PR 생성까지 한 번에. PR 템플릿도 자동 반영","when":"작업이 끝나 올릴 준비가 됐을 때","prompt":"$yeet 지금 작업을 stage, commit, push 하고 PR까지 열어줘. 커밋 메시지와 PR 제목은 올리기 전에 먼저 보여줘.","caution":"gh(GitHub CLI) 로그인 필요. GitHub 전용","originalInstall":"$skill-installer yeet   # Codex 안에서 실행","source":"openai/skills","sourceUrl":"https://github.com/openai/skills","level":"실전","verified":false,"steps":[["변경 선택","커밋할 변경과 원격 저장소를 확인합니다."],["기록·전송","변경을 커밋하고 원격으로 올리는 절차를 진행합니다."],["PR 생성","변경 검토 요청을 만듭니다. 여기서는 실제 전송하지 않습니다."]]},{"id":"skill-gh-fix-ci","type":"스킬","category":"리뷰·배포","en":"$gh-fix-ci","title":"CI 실패 고치기","tags":"CI 깃허브액션 빌드실패 체크실패 PR 배포","description":"GitHub Actions 로그를 직접 가져와 실패 원인을 요약하고, 승인받은 뒤 수정","when":"PR의 빨간 체크(CI 실패)를 고쳐야 할 때","prompt":"$gh-fix-ci 이 PR의 실패한 GitHub Actions 체크를 분석해줘. 로그에서 원인을 요약하고 수정 계획을 먼저 보여준 뒤, 내가 승인하면 고쳐줘.","caution":"GitHub Actions만 지원 (다른 CI는 링크만 안내)","originalInstall":"$skill-installer gh-fix-ci   # Codex 안에서 실행","source":"openai/skills","sourceUrl":"https://github.com/openai/skills","level":"실전","verified":false,"steps":[["실패 로그","실패한 GitHub Actions 검사의 로그를 조사합니다."],["원인·계획","확인한 원인과 필요한 수정 계획을 제시합니다."],["수정·재검사","승인된 범위에서 고친 뒤 검사를 다시 확인합니다."]]},{"id":"skill-gh-address-comments","type":"스킬","category":"리뷰·배포","en":"$gh-address-comments","title":"리뷰 코멘트 반영","tags":"PR 리뷰 코멘트 피드백 반영 수정요청","description":"PR 리뷰 코멘트를 번호와 요약으로 정리하고, 내가 고른 것만 반영","when":"PR에 리뷰 코멘트가 잔뜩 달렸을 때","prompt":"$gh-address-comments 이 PR의 리뷰 코멘트를 번호와 요약으로 정리해줘. 내가 고른 것만 반영해줘.","caution":"","originalInstall":"$skill-installer gh-address-comments   # Codex 안에서 실행","source":"openai/skills","sourceUrl":"https://github.com/openai/skills","level":"실전","verified":false,"steps":[["의견 모으기","PR에 달린 검토 의견을 번호와 요약으로 정리합니다."],["항목 선택","어떤 의견을 반영할지 사용자가 선택합니다."],["변경 확인","선택한 의견만 반영하고 결과를 검토합니다."]]},{"id":"skill-impeccable","type":"스킬","category":"디자인·UI","en":"$impeccable","title":"임페커블 (디자인 다듬기)","tags":"디자인 AI티 촌스러움 뻔함 다듬기 폴리시 간격 글꼴 색 애니메이션 모바일 접근성","description":"디자인 명령 24개와 자동 검사 규칙 62개. Inter 폰트, 보라→파랑 그라데이션, 카드 속 카드, 색 배경 위 회색 글씨 같은 AI 특유의 뻔한 디자인을 잡아냄","when":"화면에서 \"AI가 만든 티\"가 날 때, 배포 전 마지막 디자인 점검 때","prompt":"$impeccable critique [페이지]\n$impeccable polish [페이지]\n$impeccable audit [페이지]\n# 부분 수정: layout(간격) · typeset(글꼴) · colorize(색) · animate(움직임) · adapt(모바일) · quieter/bolder(톤 낮추기/높이기)","caution":"프로젝트마다 처음 한 번 $impeccable init 실행 (PRODUCT.md 생성). UI 용어 사전의 용어와 함께 쓰면 요청이 정확해짐","originalInstall":"npx impeccable install   # 목록에서 Codex 선택\n# 설치 후 Codex에서 /hooks 열어 훅 승인 → $impeccable init","source":"pbakaus/impeccable","sourceUrl":"https://github.com/pbakaus/impeccable","level":"실전","verified":false,"steps":[["화면 진단","글자·색·간격·모바일 배치를 살펴봅니다."],["부분 다듬기","목적에 맞춰 필요한 디자인 요소를 개선합니다."],["사용 확인","보기 좋은지와 실제로 쓰기 편한지를 함께 확인합니다."]]},{"id":"skill-ui-ux-pro-max","type":"스킬","category":"디자인·UI","en":"$ui-ux-pro-max","title":"UI UX 프로 맥스 (디자인 시스템)","tags":"디자인 디자인시스템 색 폰트 스타일 테마 랜딩 업종 AI티","description":"제품 종류에 맞는 스타일, 색 조합, 글꼴 짝, 레이아웃 패턴, 피해야 할 패턴까지 디자인 시스템을 생성","when":"새 화면을 만들기 전 방향을 잡을 때, 기존 앱 테마를 통째로 바꿀 때","prompt":"$ui-ux-pro-max [제품 종류, 예: 예약 서비스 랜딩 페이지]에 맞는 디자인 시스템(스타일, 색, 글꼴, 피해야 할 패턴)을 먼저 추천하고, 그 기준으로 화면을 만들어줘. 기존 컴포넌트 구조와 동작은 유지해줘.","caution":"검색 스크립트에 Python 3 필요","originalInstall":"npm install -g ui-ux-pro-max-cli\nuipro init --ai codex   # Python 3 필요","source":"nextlevelbuilder/ui-ux-pro-max-skill","sourceUrl":"https://github.com/nextlevelbuilder/ui-ux-pro-max-skill","level":"실전","verified":false,"steps":[["제품 맥락","누가 어떤 목적의 화면을 쓰는지 정합니다."],["디자인 기준","색·글꼴·간격과 화면 패턴을 제안합니다."],["일관된 적용","기존 동작을 보존하며 기준을 화면에 적용합니다."]]},{"id":"skill-frontend-design","type":"스킬","category":"디자인·UI","en":"$frontend-design","title":"프런트엔드 디자인 (Anthropic 공식)","tags":"디자인 AI티 템플릿 뻔함 개성 랜딩 첫화면","description":"흔한 템플릿 느낌을 피하고 분명한 디자인 방향을 정해 일관되게 적용하는 Anthropic 공식 스킬 (Impeccable의 출발점)","when":"새 페이지·컴포넌트를 처음 만들 때","prompt":"$frontend-design [페이지]를 만들어줘. 흔한 템플릿 느낌을 피하고, 분명한 디자인 방향을 하나 정해서 글꼴·색·레이아웃에 일관되게 적용해줘.","caution":"","originalInstall":"npx skills add https://github.com/anthropics/skills --skill frontend-design","source":"anthropics/skills","sourceUrl":"https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md","level":"실전","verified":true,"steps":[["시각 방향","사용자와 목적에 맞는 디자인 방향을 정합니다."],["구현","글꼴·색·간격·배치를 일관되게 적용합니다."],["다듬기","실제 화면에서 읽기와 조작에 문제가 없는지 확인합니다."]]},{"id":"skill-caveman","type":"스킬","category":"세션·토큰","en":"$caveman","title":"케이브맨 (토큰 절약)","tags":"토큰 절약 사용량 장황 짧게 비용 간결","description":"코드·명령·에러 메시지는 그대로 두고 설명만 아주 짧게 답하게 함","when":"답변이 길어서 읽기 힘들 때, 사용량을 아끼고 싶을 때","prompt":"$caveman\n# 이후 답변이 짧아짐. 원래대로: stop caveman","caution":"전체 CLI(npx @caveman-ai/cli)에는 프록시·사용 통계 전송 등이 포함됨. 답변만 짧게 하려면 위 스킬만 설치","originalInstall":"npx skills add JuliusBrussee/caveman -g","source":"JuliusBrussee/caveman","sourceUrl":"https://github.com/JuliusBrussee/caveman","level":"실전","verified":false,"steps":[["긴 설명","코드와 명령 외 설명이 너무 길어 읽기 어렵습니다."],["간결 모드","코드·오류 내용은 유지하고 설명을 짧게 합니다."],["필요 시 해제","중요한 판단 근거가 부족하면 자세한 설명을 다시 요청합니다."]]},{"id":"skill-handoff","type":"스킬","category":"세션·토큰","en":"$handoff","title":"핸드오프 (인수인계 문서)","tags":"대화길어짐 컨텍스트 멍청해짐 헷갈림 새세션 인수인계 넘기기","description":"현재 세션을 다음 세션용 문서로 압축: 목표, 필요한 맥락, 쓸 스킬, 관련 파일 위치","when":"대화가 길어져 AI가 앞 내용을 헷갈리기 시작할 때, 새 세션이나 다른 에이전트로 넘길 때","prompt":"$handoff 지금 세션을 인수인계 문서로 정리해줘. 다음 세션의 목표, 필요한 맥락, 쓸 스킬, 관련 파일 위치를 담고 프로젝트 docs 폴더에 저장해줘.","caution":"기본 저장 위치가 임시 폴더라서 남기려면 저장 위치를 지정","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["현재 상태","목표와 완료한 일, 남은 일을 확인합니다."],["인계 문서","관련 파일·결정·실행 방법을 정리합니다."],["다음 대화","문서를 참고해 다음 작업을 이어갑니다."]]},{"id":"skill-retro","type":"스킬","category":"세션·토큰","en":"$retro","title":"레트로 (회고)","tags":"회고 반복 같은실수 또 실수 지침 개선 규칙추가","description":"작업 기록을 읽고 무엇이 잘못됐는지, 지침·자동 검사·도구를 어떻게 바꾸면 좋을지 심각한 것부터 제안","when":"AI가 이상하게 굴었던 세션이 끝난 직후, 같은 실수가 반복될 때","prompt":"$retro 이번 세션에서 AI가 실수하거나 내 의도와 다르게 한 부분을 돌아보고, AGENTS.md나 자동 검사 규칙에 무엇을 추가하면 좋을지 심각한 것부터 제안해줘. 적용은 내가 고른 것만 해줘.","caution":"자동으로 매번 돌리지 말 것. 문제없는 것까지 고치다 엉뚱한 방향으로 갈 수 있음 (문제 있던 세션만 골라서)","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["작업 돌아보기","원치 않은 수정이나 반복 오류가 있었는지 봅니다."],["개선 제안","지침·도구·검사 중 바꿀 부분을 제시합니다."],["선택 적용","필요한 개선만 골라 적용합니다."]]},{"id":"skill-wait-what","type":"스킬","category":"이해·분석","en":"$wait-what","title":"웨잇 왓 (쉽게 다시 설명)","tags":"이해 이해안됨 설명어려움 쉽게 용어풀이 무슨말 전문용어","description":"방금 AI 설명을 내가 모르는 맥락까지 채워서 쉬운 말과 예시로 다시 설명","when":"AI 설명을 읽고 \"그래서 뭘 하겠다는 거지?\" 싶을 때","prompt":"$wait-what 방금 설명을 이해하지 못했어. 내가 모르는 맥락을 채워서 쉬운 말과 예시로 다시 설명해줘.","originalInstall":"codex plugin marketplace add mattpocock/skills\ncodex plugin add mattpocock-skills@mattpocock\n# 저장소마다 한 번: Codex에서 $setup-matt-pocock-skills 실행","source":"mattpocock/skills","sourceUrl":"https://github.com/mattpocock/skills","level":"실전","verified":false,"steps":[["이해 막힘","“상태 관리와 렌더링을 분리하자”는 설명이 어렵습니다."],["배경 채우기","상태는 기억하는 값, 렌더링은 그 값을 화면에 그리는 일로 풉니다."],["예로 연결","검색어가 바뀌면 목록을 다시 보여주는 예로 설명합니다."]]},{"id":"skill-rea","type":"스킬","category":"이해·분석","en":"REA (MCP)","title":"리버스 엔지니어 애니씽","tags":"따라만들기 다른앱 기능분석 리버스엔지니어링 소스없음 동작원리 클론","description":"소스 코드 없이 앱(데스크톱, Electron, 웹사이트, .NET 등)을 분석해 기능 동작을 근거와 함께 설명하는 MCP 서버. Ghidra·Hopper·IDA 같은 기존 분석 도구를 에이전트에 연결해 줌","when":"내가 소유했거나 분석 권한이 있는 앱의 기능 동작을 알아내 비슷하게 구현하고 싶을 때. 웹 화면 정도는 REA 없이 에이전트에게 분석시켜도 상당 부분 가능","prompt":"REA로 [내 앱 또는 분석 허가된 앱]의 [기능]이 어떻게 동작하는지 조사해줘. 근거와 확인하지 못한 부분을 함께 보여주고, 내 프로젝트에 비슷한 기능을 만들어 테스트해줘.","caution":"본인 소유 또는 분석 허가된 소프트웨어만 대상으로 하고, 지식재산권과 라이선스 위반에 주의. 출처를 모르는 프로그램 안에 AI를 조종하는 지시가 숨어 있을 수 있으니 샌드박스에서 실행. 결과는 원본 코드가 아니라 의사코드와 근거임","originalInstall":"npx rea-agents setup   # Codex 선택 → 변경 내용 확인·승인 → Codex 재시작","source":"morluto/rea","sourceUrl":"https://github.com/morluto/rea","level":"심화","verified":false,"steps":[["권한·대상","분석 권한이 있는 앱과 조사할 기능을 정합니다."],["동작 조사","화면·파일·허용된 분석 도구로 근거를 모읍니다."],["구조 설명","관찰 사실과 추정·미확인을 구분합니다. 실제 분석 도구는 별도 필요합니다."]]},{"id":"skill-firecrawl","type":"스킬","category":"이해·분석","en":"$firecrawl","title":"파이어크롤 (최신 웹 자료)","tags":"최신문서 웹검색 리서치 자료조사 옛날버전 에러검색 크롤링","description":"검색·스크래핑·크롤링으로 실시간 웹 자료를 가져와 최신 문서를 근거로 작업","when":"AI가 옛 버전 API를 쓰거나 최신 문서·해결 사례를 찾아야 할 때","prompt":"[라이브러리] 공식 문서에서 최근 변경사항(breaking changes)을 찾아 정리하고, 우리 코드에서 고쳐야 할 곳을 알려줘.","caution":"API 키 필요 (무료 월 1,000 크레딧)","originalInstall":"npx -y firecrawl-cli@latest init --all --browser","source":"firecrawl/cli","sourceUrl":"https://github.com/firecrawl/cli","level":"실전","verified":false,"steps":[["질문 정하기","필요한 최신 문서나 조사 주제를 정합니다."],["자료 수집","검색·페이지 읽기로 관련 자료를 찾습니다."],["출처 정리","날짜와 근거를 붙이고 확인하지 못한 부분을 표시합니다."]]},{"id":"skill-skill-creator","type":"스킬","category":"도구 만들기","en":"$skill-creator","title":"스킬 크리에이터 (스킬 만들기)","tags":"스킬만들기 반복 반복작업 자동화 나만의스킬 같은설명","description":"반복하는 작업을 SKILL.md로 만들어 줌. Codex 기본 내장","when":"같은 설명을 AI에게 세 번 이상 반복했을 때, 잘된 세션의 방법을 저장하고 싶을 때","prompt":"$skill-creator 내가 반복하는 작업 [작업 설명]을 스킬로 만들어줘. 언제 써야 하는지(description)를 분명하게 써줘.\n# 또는: 이번 세션에서 배운 점을 스킬로 정리해줘","caution":"","originalInstall":"기본 내장 (설치 불필요)","source":"openai/skills","sourceUrl":"https://github.com/openai/skills","level":"실전","verified":false,"steps":[["반복 발견","같은 입력·절차·결과의 작업이 반복됩니다."],["지침 만들기","언제 쓰고 어떻게 진행할지 SKILL.md로 정리합니다."],["실제 확인","예시 작업에서 지침이 유용한지 확인합니다."]]},{"id":"skill-mcp-builder","type":"스킬","category":"도구 만들기","en":"$mcp-builder","title":"MCP 빌더","tags":"MCP 서버 도구 API연결 DB조회 내부서비스","description":"조사·계획 → 구현 → 테스트 → 평가 4단계로 품질 좋은 MCP 서버를 만들게 안내","when":"에이전트가 우리 서비스·DB·API를 직접 쓰게 하고 싶을 때","prompt":"$mcp-builder [내부 API/서비스]를 에이전트가 쓸 수 있는 MCP 서버로 만들어줘. 조사·계획, 구현, 테스트, 평가 단계를 순서대로 따라줘.","caution":"평가 단계까지 하면 시간이 걸림. 간단한 실험엔 과할 수 있음","originalInstall":"npx skills add https://github.com/anthropics/skills --skill mcp-builder","source":"anthropics/skills","sourceUrl":"https://github.com/anthropics/skills","level":"심화","verified":false,"steps":[["연결 설계","어떤 서비스의 어떤 기능을 도구로 제공할지 정합니다."],["도구 구현","권한과 입력·응답·실패 처리를 구현합니다."],["검사·평가","도구 동작과 실제 작업 수행을 확인합니다."]]},{"id":"extra-webapp","title":"웹앱 동작 검사","en":"webapp-testing","description":"브라우저 자동화로 웹 기능을 확인하고 화면·로그를 조사하는 방법을 안내합니다. Playwright 등 실행 환경이 필요합니다.","sourceUrl":"https://github.com/anthropics/skills/blob/main/skills/webapp-testing/SKILL.md","source":"anthropics/skills","type":"스킬","category":"추가 스킬","level":"실전","verified":true,"added":true,"tags":"웹앱 동작 검사 webapp-testing","steps":[["시나리오","시험명 입력 후 저장하는 흐름을 정합니다."],["브라우저 조작","입력칸을 채우고 저장을 누르는 검사를 실행합니다."],["결과 확인","목록 표시·로그·화면을 확인합니다. 여기서는 예시만 표시합니다."]],"prompt":"webapp-testing 스킬을 사용할 수 있다면 [주소]의 입력·저장·오류 처리를 검사해줘. 필요한 도구를 먼저 확인하고 실제로 실행한 결과와 미확인을 구분해줘.","caution":"스킬 원문과 필요한 도구를 확인하세요. 이 체험은 실제 스킬 실행이 아닙니다."},{"id":"extra-guidelines","title":"웹 화면 사용성 점검","en":"web-design-guidelines","description":"웹 인터페이스 가이드를 참고해 입력·상호작용·접근성 등을 검토합니다. 원문에서 요구하는 최신 가이드 확인이 필요합니다.","sourceUrl":"https://github.com/vercel-labs/agent-skills/blob/main/skills/web-design-guidelines/SKILL.md","source":"vercel-labs/agent-skills","type":"스킬","category":"추가 스킬","level":"실전","verified":true,"added":true,"tags":"웹 화면 사용성 점검 web-design-guidelines","steps":[["문제 찾기","입력칸 이름이 없고 키보드 초점이 보이지 않습니다."],["개선","보이는 라벨과 초점 표시를 추가합니다."],["확인","마우스 없이 이동하고 입력 오류를 알아볼 수 있는지 확인합니다."]],"prompt":"web-design-guidelines 스킬로 [화면]을 점검해줘. 최신 원문 기준을 확인하고 키보드 이동, 입력 라벨, 오류 안내, 모바일 배치를 우선 봐줘.","caution":"스킬 원문과 필요한 도구를 확인하세요. 이 체험은 실제 스킬 실행이 아닙니다."},{"id":"extra-react","title":"React 성능 검토","en":"vercel-react-best-practices","description":"React·Next.js 앱에서 데이터 로딩과 렌더링 패턴을 검토합니다. 일반 HTML 사이트에는 그대로 적 function validRecord(x){return x&&Array.isArray(x.favorites)&&Array.isArray(x.completed)&&x.favorites.every(y=>typeof y==='string')&&x.completed.every(y=>typeof y==='string')&&(x.last===null||typeof x.last==='string');}
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(validRecord(x))record={favorites:x.favorites.filter(id=>ids.has(id)),completed:x.completed.filter(id=>ids.has(id)),last:ids.has(x.last)?x.last:null};}localStorage.setItem(KEY,JSON.stringify(record));}catch{storageAvailable=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(record));}catch{storageAvailable=false;toast('기록을 저장하지 못했습니다. 기록 관리에서 파일로 보관해 주세요.');}updateProgress();}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2800);}
const tabs=['전체','기초 개념','UI 용어','스킬','즐겨찾기'];
const situations=[
 ['어디서 시작하지?',['base-vibe','base-prompt','skill-grill-me','skill-to-spec','skill-prototype']],
 ['원하는 화면을 설명하고 싶어',['ui-responsive','ui-card','ui-modal','ui-drawer','ui-tabs','ui-stagger','skill-frontend-design']],
 ['오류가 안 고쳐져',['base-debug','skill-diagnosing-bugs','skill-systematic-debugging','skill-tdd']],
 ['다 됐다는데 안 돼',['base-test','skill-verification','extra-webapp','extra-guidelines']],
 ['저장·서버가 헷갈려',['base-frontend','base-backend','base-api','base-javascript']],
 ['기록하고 배포하고 싶어',['base-git','base-branch','base-github','base-deploy','skill-pr','skill-finishing']],
 ['대화가 길어졌어',['base-context','skill-handoff','skill-retro','skill-wait-what']]
];
function counts(t){return t==='전체'?ITEMS.length:t==='즐겨찾기'?record.favorites.length:ITEMS.filter(i=>i.type===t).length;}
function renderControls(){
 $('#tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'on':''}" data-tab="${t}" aria-pressed="${tab===t}">${t}<span class="tab-count">${counts(t)}</span></button>`).join('');
 $('#situations').innerHTML=situations.map(([s])=>`<button class="chip situation ${situation===s?'on':''}" data-situation="${s}" aria-pressed="${situation===s}">${s}</button>`).join('');
 const cats=['전체',...new Set(ITEMS.filter(i=>tab==='전체'||tab==='즐겨찾기'||i.type===tab).map(i=>i.category))];
 if(!cats.includes(category))category='전체';
 $('#categories').innerHTML=cats.map(c=>`<button class="chip ${category===c?'on':''}" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('');
}
function svgFlow(t,step){const steps=t.steps||[],n=steps.length,w=300,gap=9,node=(w-gap*(n-1))/n;return `<svg viewBox="0 0 300 48" role="img" aria-label="${esc(steps.map((s,i)=>`${i+1}단계 ${s[0]}`).join(', '))}">${steps.map((s,i)=>{const x=i*(node+gap);return `${i?`<path d="M ${x-8} 23 h6 m-3 -3 3 3 -3 3" stroke="#8ba894" fill="none"/>`:''}<rect x="${x}" y="4" width="${node}" height="38" rx="7" fill="${i===step?'#17685b':i<step?'#dbeadd':'#fff'}" stroke="${i===step?'#17685b':'#d7e1d5'}"/><text x="${x+node/2}" y="27" text-anchor="middle" fill="${i===step?'#fff':'#4b6554'}" font-size="10" font-family="system-ui,sans-serif">${esc(s[0])}</text>`;}).join('')}</svg>`;}
function simulation(t){return `<div class="sim" data-sim="${t.id}" data-step="0" data-mode="success">${t.id==='base-api'?'<div class="sim-mode"><button class="on" data-mode="success" aria-pressed="true">성공 응답</button><button data-mode="error" aria-pressed="false">오류 응답</button></div>':''}<div class="sim-flow">${svgFlow(t,0)}</div><div class="sim-title">${esc(t.steps[0][0])}</div><p class="sim-text">${esc(t.steps[0][1])}</p><div class="sim-controls"><button data-step-change="-1" disabled aria-label="이전 단계">이전</button><span>1 / ${t.steps.length}</span><button data-step-change="1" aria-label="다음 단계">다음 단계</button></div></div>`;}
function card(t){const fav=record.favorites.includes(t.id),done=record.completed.includes(t.id);return `<article class="card ${done?'completed':''}" id="${t.id}" data-card="${t.id}"><div class="card-top"><div class="meta"><div class="badges"><span class="badge ${t.type==='스킬'?'skill':t.type==='기초 개념'?'basic':''}">${esc(t.category)}</span>${t.added?'<span class="new-badge">추가</span>':''}</div><button class="favorite" data-favorite="${t.id}" aria-label="${esc(t.title)} 즐겨찾기" aria-pressed="${fav}" title="즐겨찾기">${fav?'★':'☆'}</button></div><h3>${esc(t.title)}<span class="en">${esc(t.en)}</span></h3><p class="description">${esc(t.description)}</p></div><div class="preview-label">${t.demo?'직접 눌러 보세요 · UI 체험':'학습용 시뮬레이션 · AI 실행 아님'}</div><div class="preview">${t.demo?`<iframe loading="lazy" sandbox="allow-scripts" title="${esc(t.title)} 동작 체험" data-demo="${t.demo}"></iframe>`:simulation(t)}</div><div class="card-bottom"><label class="done"><input type="checkbox" data-complete="${t.id}" ${done?'checked':''}>학습 완료</label><button class="details-button" data-detail="${t.id}" aria-haspopup="dialog">요청문·자세히 <span aria-hidden="true">↗</span></button></div></article>`;}
function render(){
 renderControls();const words=$('#q').value.trim().split(/\s+/).filter(Boolean).map(norm), sit=situations.find(x=>x[0]===situation),querySit=situations.find(x=>norm(x[0])===norm($('#q').value)),courseIds=course>=0?COURSES[course].ids:null;
 let list=ITEMS.filter(t=>(tab==='전체'||(tab==='즐겨찾기'?record.favorites.includes(t.id):t.type===tab))&&(category==='전체'||t.category===category)&&(!sit||sit[1].includes(t.id))&&(!courseIds||courseIds.includes(t.id))&&(querySit?querySit[1].includes(t.id):words.every(w=>norm([t.title,t.en,t.tags,t.description,t.category,t.source,t.keywords,t.id==='ui-drawer'?'옆에서 나오는 메뉴':''].join(' ')).includes(w))));
 if(courseIds)list.sort((a,b)=>courseIds.indexOf(a.id)-courseIds.indexOf(b.id));
 if($('#sort').value==='name')list.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
 if($('#sort').value==='unfinished')list.sort((a,b)=>Number(record.completed.includes(a.id))-Number(record.completed.includes(b.id)));
 $('#list-title').textContent=course>=0?COURSES[course].title:situation||((tab==='전체'?'전체':tab)+' 가이드');$('#count').textContent=`${list.length}개 / 전체 ${ITEMS.length}개`;
 $('#clear').hidden=!(words.length||category!=='전체'||situation||course>=0||tab!=='전체');
 $('#context-note').textContent=tab==='스킬'?'스킬의 사용 조건·출처·요청문은 상세에서 확인하세요. 설치되어 있어야 사용할 수 있으며, 체험은 실제 실행이 아닙니다.':'';
 $('#main').innerHTML=list.map(card).join('')||`<div class="empty"><h3>${tab==='즐겨찾기'?'아직 즐겨찾은 카드가 없어요.':'조건에 맞는 카드가 없어요.'}</h3><p>${tab==='즐겨찾기'?'카드 오른쪽의 별을 눌러 모아 보세요.':'검색어를 줄이거나 분류·상황 조건을 초기화해 보세요.'}</p><button data-reset>전체 카드 보기</button></div>`;
 $('#main').querySelectorAll('iframe[data-demo]').forEach(f=>{f.srcdoc=DEMO_DOC.replace('const id=DEMO_ID;',`const id=${JSON.stringify(f.dataset.demo)};`);});
 updateProgress();renderCourse();
}
function updateProgress(){const total=new Set(COURSES.flatMap(c=>c.ids)),n=[...total].filter(id=>record.completed.includes(id)).length;$('#course-total').textContent=`입문 코스 ${n} / ${total.size}개 완료`;}
function renderCourse(){
 $('#course-panel').hidden=course<0;$('#welcome').hidden=course>=0;
 if(course<0)return;
 $('#course-list').innerHTML=COURSES.map((c,i)=>`<button class="course-step ${i===course?'on':''}" data-course="${i}" aria-pressed="${i===course}"><b>${esc(c.title)}</b><small>${esc(c.desc)} · ${c.ids.filter(id=>record.completed.includes(id)).length}/${c.ids.length}</small></button>`).join('');
 $('#course-guidance').innerHTML=`화면의 체험을 조작한 뒤 이해한 카드에 ‘학습 완료’를 표시하세요. ${course<COURSES.length-1?'<button data-next-course>다음 단계 보기</button>':'<span>마지막 단계입니다. 필요한 카드는 즐겨찾기로 모아 두세요.</span>'}`;
}
function reset(){tab='전체';category='전체';situation='';course=-1;$('#q').value='';$('#sort').value='default';render();}
function startCourse(n){tab='전체';category='전체';situation='';$('#q').value='';course=n;render();$('#course-panel').scrollIntoView({block:'start',behavior:'instant'});}
function openDrawer(title,badge,content){returnFocus=document.activeElement;$('#drawer-badge').textContent=badge;$('#drawer-body').innerHTML=`<h2 id="drawer-title">${esc(title)}</h2>${content}`;$('#drawer').showModal();$('#drawer').scrollTop=0;}
function closeDrawer(){$('#drawer').close();activeItem=null;if(returnFocus?.isConnected)returnFocus.focus();}
function promptBlock(title,text,key){return `<div class="copy-row"><h3>${title}</h3><button data-copy="${key}">복사</button></div><div class="field">${esc(text)}</div>`;}
function detail(id){const t=ITEMS.find(x=>x.id===id);if(!t)return;activeItem=t;record.last=id;save();
 const prompt=t.prompt.replace(/^成功/,'성공');
 let body=`<span class="en">${esc(t.en)} · ${esc(t.level)}</span><p>${esc(t.description)}</p>${t.when?`<h3>언제 쓰나요?</h3><p>${esc(t.when)}</p>`:''}`;
 if(t.type==='스킬')body+=`<div class="notice">${t.verified?'GitHub 스킬 원문 확인 · 2026.10.27':'기존 사전 수록 · 개별 스킬의 최신 원문·설치 절차는 재확인 필요'}<br>스킬 설치·도구 연결은 이 가이드북이 실행하지 않습니다. Codex에서는 설치된 스킬을 이름으로 요청하거나 $로 선택할 수 있습니다. 다른 도구에서는 호출 방식이 다를 수 있습니다.</div>`;
 body+=promptBlock(t.demo?'만들기 요청문':'실전에 쓸 요청문',prompt,'prompt');
 if(t.edit)body+=promptBlock('수정 요청문',t.edit,'edit');
 if(t.keywords)body+=`<h3>코드에서 찾을 단어</h3><p>편집기에서 Ctrl+F로 검색할 때 참고하세요.</p><code>${esc(t.keywords)}</code>`;
 if(t.caution)body+=`<h3>사용 조건·주의할 점</h3><p>${esc(t.caution)}</p>`;
 if(t.steps)body+=`<h3>체험을 실제 작업에 연결하기</h3><p>이 카드의 단계 표시는 이해를 돕기 위한 요약입니다. 실제 스킬의 전체 절차나 실행 결과를 대신하지 않습니다.</p>`;
 body+=`<h3>출처</h3><p>${t.sourceUrl?`<a href="${esc(t.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(t.source)} ↗</a>`:esc(t.source)}</p>`;
 if(t.type==='스킬')body+=`<p class="source-tag">저장소의 인기는 개별 스킬의 품질을 보장하지 않습니다. 수록 항목을 모두 설치할 필요는 없습니다.</p>`;
 if(t.originalInstall)body+=`<details><summary>기존 사전의 설치 참고 내용</summary><p>원문 보존용입니다. 현재 환경에서 검증한 설치 명령이 아닙니다. 공식 저장소의 최신 안내와 변경 내용을 먼저 확인하세요.</p><code>${esc(t.originalInstall)}</code></details>`;
 body+=`<div class="tools"><button data-related="${esc(t.type)}">같은 종류 더 보기</button></div>`;openDrawer(t.title,t.type+' / '+t.category,body);
}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;left:0;top:0;opacity:0';$('#drawer-body').append(a);a.select();if(!document.execCommand('copy'))throw Error('copy');a.remove();}toast('요청문을 복사했어요. 필요한 항목을 바꿔 사용하세요.');}catch{const area=document.createElement('textarea');area.value=text;area.readOnly=true;$('#drawer-body').append(area);area.focus();area.select();toast('자동 복사가 제한됩니다. 선택한 내용을 직접 복사해 주세요.');}}
function manage(){openDrawer('내 학습 기록','THIS BROWSER',`<p>즐겨찾기 ${record.favorites.length}개 · 학습 완료 ${record.completed.length}개</p><div class="notice">이 브라우저에만 저장합니다. PC·휴대폰 자동 동기화는 제공하지 않습니다. 브라우저 데이터 삭제·시크릿 모드·다른 주소에서는 기록이 유지되지 않을 수 있습니다.${storageAvailable?'':' 현재 브라우저에서 저장을 사용할 수 없습니다.'}</div><h3>기기를 바꿀 때</h3><p>기록 파일을 내보내 다른 기기로 옮긴 뒤 가져오세요. 기존 기록과 합쳐집니다. 파일에는 카드 번호와 최근 위치만 들어갑니다.</p><div class="tools"><button data-export class="primary">기록 내보내기</button><label class="file-label">기록 가져오기<input type="file" id="import-file" accept="application/json,.json"></label></div>${record.last?`<h3>최근 본 카드</h3><button data-resume="${record.last}">${esc(ITEMS.find(t=>t.id===record.last)?.title)}</button>`:''}`);}
function about(){openDrawer('보고, 눌러 보고, 요청하기','ABOUT THIS GUIDE',`<p>원본 UI 사전의 검색·분류·카드와 동작 체험을 유지하고, 요청문과 자세한 설명을 드로어로 분리했습니다.</p><h3>자료 구성</h3><p>사용자 제공 UI 용어 24개, 기존 스킬 35개, 기초 개념 16개, 추가 스킬 3개로 총 78개입니다. 기존 항목의 설명과 설치 참고 내용은 보존했습니다.</p><h3>자료의 확인 상태</h3><p>추가 스킬 3개와 기존 스킬 5개의 SKILL.md는 2026년 10월 27일 확인했습니다. 나머지 기존 항목은 최신 원문 재확인이 필요한 것으로 표시합니다. 별점 수치를 품질 순위로 표시하지 않습니다.</p><p><a href="https://learn.chatgpt.com/docs/build-skills" target="_blank" rel="noopener">OpenAI 공식 스킬 안내</a><br><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website" target="_blank" rel="noopener">MDN 웹 개발 입문</a><br><a href="https://git-scm.com/docs/gittutorial" target="_blank" rel="noopener">Git 공식 입문</a></p><h3>회사에서 사용하기</h3><p>로그인과 AI 연결 없이 열립니다. 외부 글꼴·분석 서비스·CDN을 사용하지 않습니다. 출처 링크를 누르면 외부 사이트로 이동합니다. 회사망·휴대폰 실제 기기 접근은 별도 확인이 필요합니다.</p><h3>체험과 실제 작업의 차이</h3><p>UI 체험은 이 화면 안에서만 작동합니다. 개발 개념·스킬 체험은 학습용 예시이며 실제 도구 실행이나 성능 측정값이 아닙니다. 학습 완료는 본인의 확인 표시입니다.</p>`);}
function stepSim(el,delta){const t=ITEMS.find(x=>x.id===el.dataset.sim),step=Math.max(0,Math.min(t.steps.length-1,Number(el.dataset.step)+delta));el.dataset.step=step;const error=el.dataset.mode==='error';el.classList.toggle('error',error);el.querySelector('.sim-flow').innerHTML=svgFlow(t,step);el.querySelector('.sim-title').textContent=error&&step===2?'오류 응답':t.steps[step][0];el.querySelector('.sim-text').textContent=error&&step===2?'예시: 서버에서 요청을 처리하지 못했습니다. 성공 메시지 대신 재시도 안내를 보여줍니다.':t.steps[step][1];el.querySelector('.sim-controls span').textContent=`${step+1} / ${t.steps.length}`;el.querySelector('[data-step-change="-1"]').disabled=step===0;el.querySelector('[data-step-change="1"]').disabled=step===t.steps.length-1;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-tab')){tab=b.dataset.tab;category='전체';situation='';course=-1;render();}
 if(b.hasAttribute('data-category')){category=b.dataset.category;render();}
 if(b.hasAttribute('data-situation')){situation=situation===b.dataset.situation?'':b.dataset.situation;tab='전체';category='전체';course=-1;$('#q').value='';render();}
 if(b.hasAttribute('data-favorite')){const id=b.dataset.favorite;record.favorites=record.favorites.includes(id)?record.favorites.filter(x=>x!==id):[...record.favorites,id];save();if(tab==='즐겨찾기')render();else{b.textContent=record.favorites.includes(id)?'★':'☆';b.setAttribute('aria-pressed',record.favorites.includes(id));renderControls();}toast(record.favorites.includes(id)?'즐겨찾기에 추가했어요.':'즐겨찾기에서 제외했어요.');}
 if(b.hasAttribute('data-detail'))detail(b.dataset.detail);
 if(b.hasAttribute('data-copy')&&activeItem)copyText(activeItem[b.dataset.copy]);
 if(b.hasAttribute('data-course'))startCourse(Number(b.dataset.course));
 if(b.hasAttribute('data-next-course'))startCourse(course+1);
 if(b.hasAttribute('data-reset'))reset();
 if(b.hasAttribute('data-step-change'))stepSim(b.closest('.sim'),Number(b.dataset.stepChange));
 if(b.hasAttribute('data-mode')){const el=b.closest('.sim');el.dataset.mode=b.dataset.mode;el.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});stepSim(el,0);}
 if(b.hasAttribute('data-export')){const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,...record},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='vibe-guidebook-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록 파일을 내보냈어요.');}
 if(b.hasAttribute('data-resume')){const id=b.dataset.resume;closeDrawer();detail(id);}
 if(b.hasAttribute('data-related')){tab=b.dataset.related;category='전체';situation='';course=-1;$('#q').value='';closeDrawer();render();}
});
document.addEventListener('change',async e=>{
 if(e.target.matches('[data-complete]')){const id=e.target.dataset.complete;record.completed=e.target.checked?[...new Set([...record.completed,id])]:record.completed.filter(x=>x!==id);record.last=id;save();e.target.closest('.card').classList.toggle('completed',e.target.checked);renderCourse();if($('#sort').value==='unfinished')render();}
 if(e.target.id==='import-file'){try{const file=e.target.files[0];if(!file)return;if(file.size>100000)throw Error('size');const x=JSON.parse(await file.text());if(x.version!==1||!validRecord(x))throw Error('format');record.favorites=[...new Set([...record.favorites,...x.favorites.filter(id=>ids.has(id))])];record.completed=[...new Set([...record.completed,...x.completed.filter(id=>ids.has(id))])];if(ids.has(x.last))record.last=x.last;save();render();closeDrawer();toast('기존 기록과 합쳐서 가져왔어요.');}catch{toast('가이드북에서 내보낸 올바른 기록 파일인지 확인해 주세요.');e.target.value='';}}
});
$('#q').addEventListener('input',()=>{clearTimeout(render.timer);render.timer=setTimeout(render,140);});$('#sort').onchange=render;$('#clear').onclick=reset;$('#start-course').onclick=()=>startCourse(0);$('#exit-course').onclick=reset;$('#records').onclick=manage;$('#about').onclick=about;$('#close-drawer').onclick=closeDrawer;
$('.brand').onclick=e=>{e.preventDefault();reset();window.scrollTo({top:0,behavior:'instant'});};
$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientY<r.top||e.clientX>r.right||e.clientY>r.bottom)closeDrawer();}});
$('#drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!$('#drawer').open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const x=JSON.parse(e.newValue);if(validRecord(x)){record={favorites:x.favorites.filter(id=>ids.has(id)),completed:x.completed.filter(id=>ids.has(id)),last:ids.has(x.last)?x.last:null};render();}}catch{}}});
render();if(!storageAvailable)toast('기록 저장이 제한됩니다. 내보내기를 이용해 주세요.');
</script>
</body></html>
